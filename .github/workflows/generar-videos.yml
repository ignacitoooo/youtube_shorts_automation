
name: Generar YouTube Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomlkit

      - name: Configurar API
        working-directory: MoneyPrinterTurbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import tomlkit
          from pathlib import Path

          path = Path("config.example.toml")
          config = tomlkit.parse(path.read_text())

          config["app"]["video_source"] = "pexels"
          config["app"]["pexels_api_keys"] = [
              os.environ["PEXELS_API_KEY"]
          ]
          config["app"]["litellm_model_name"] = "gemini/gemini-2.5-flash"

          config["ui"]["video_language"] = "English"
          config["ui"]["video_aspect"] = "9:16"
          config["ui"]["voice_name"] = "en-US-GuyNeural"

          Path("config.toml").write_text(
              tomlkit.dumps(config)
          )

          print("Configuration created successfully.")
          PY

      - name: Comprobar configuración
        working-directory: MoneyPrinterTurbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "import tomlkit; print('TOMLKIT OK')"
          python cli.py --help

      - name: Finalizar
        run: echo "Configuration check completed."
