
name: Generate YouTube Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomlkit

      - name: Configure Gemini and Pexels
        working-directory: MoneyPrinterTurbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import tomlkit
          from pathlib import Path

          config = tomlkit.parse(
              Path("config.example.toml").read_text()
          )

          config["llm_provider"] = "gemini"
          config["gemini_api_key"] = os.environ["GEMINI_API_KEY"]
          config["gemini_model_name"] = "gemini-2.5-flash"

          config["video_source"] = "pexels"
          config["pexels_api_keys"] = [
              os.environ["PEXELS_API_KEY"]
          ]

          config["subtitle_provider"] = "edge"

          Path("config.toml").write_text(
              tomlkit.dumps(config)
          )

          print("Gemini provider:", config["llm_provider"])
          print("Pexels configured.")
          print("Edge subtitles configured.")
          PY

      - name: Generate first English Short
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-subject "10 Incredible Facts About the Universe" \
            --video-language en-US \
            --video-script-prompt "Write an engaging 60-second YouTube Shorts script in natural American English. Include ten fascinating scientifically accurate facts and a strong opening hook." \
            --video-source pexels \
            --video-aspect 9:16 \
            --voice-name en-US-GuyNeural \
            --subtitle-enabled \
            --subtitle-position bottom \
            --video-count 1 \
            --bgm-type none

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: first-english-short
          path: MoneyPrinterTurbo/storage/tasks/**/*.mp4
          if-no-files-found: error
          retention-days: 7
