
name: Generate The Healthy Years 404 - 3 Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomlkit

      - name: Configure Pexels and subtitles
        working-directory: MoneyPrinterTurbo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import tomlkit
          from pathlib import Path

          key = os.environ.get("PEXELS_API_KEY")
          if not key:
              raise SystemExit("Missing PEXELS_API_KEY")

          config = tomlkit.parse(
              Path("config.example.toml").read_text()
          )

          app = config["app"]
          app["video_source"] = "pexels"
          app["pexels_api_keys"] = [key]
          app["subtitle_provider"] = "edge"

          ui = config["ui"]
          ui["video_language"] = "English"
          ui["voice_name"] = "en-US-GuyNeural"
          ui["subtitle_enabled"] = True
          ui["subtitle_display_mode"] = "word_by_word"
          ui["subtitle_animation"] = "pop_spring"
          ui["font_size"] = 68
          ui["text_fore_color"] = "#FFE45C"
          ui["stroke_color"] = "#000000"
          ui["stroke_width"] = 3
          ui["subtitle_position"] = "two_thirds_bottom"

          Path("config.toml").write_text(
              tomlkit.dumps(config)
          )

          print("Channel configuration completed")
          PY

      - name: Generate Short 1 - Joint Health
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-script "Are your knees feeling stiff after 50? Here are three gentle habits that may support better joint movement. First, avoid sitting in the same position for too long. Stand up and move regularly. Second, try low-impact activities such as walking or swimming, choosing a level that feels comfortable. Third, include strength exercises suited to your ability, because stronger muscles help support your joints. Never push through sharp or worsening pain. If joint pain is persistent, swollen, or affecting daily life, speak with a healthcare professional. Your age does not mean you have to stop moving. Follow The Healthy Years for more practical health tips." \
            --video-terms "older adult walking in park, senior stretching, swimming pool exercise, senior fitness, healthy active aging" \
            --video-language en-US \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --video-clip-duration 3 \
            --video-concat-mode sequential \
            --video-transition-mode fade-in \
            --match-materials-to-script \
            --voice-name en-US-GuyNeural \
            --voice-rate 1.05 \
            --subtitle-enabled \
            --subtitle-position two_thirds_bottom \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --font-size 68 \
            --text-fore-color "#FFE45C" \
            --stroke-color "#000000" \
            --stroke-width 3 \
            --video-count 1 \
            --bgm-type none

      - name: Generate Short 2 - Better Sleep
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-script "Waking up tired after 50? A few simple sleep habits may help. First, try going to bed and waking up at a consistent time each day. Second, get natural daylight during the morning. Third, keep your bedroom dark, quiet, and comfortably cool. Try limiting caffeine later in the day, too. Remember, persistent sleep problems or loud snoring with breathing pauses deserve medical attention. Better sleep starts with small, consistent habits. Follow The Healthy Years for more healthy aging tips." \
            --video-terms "senior waking up in bedroom, morning sunlight through window, peaceful bedroom, older adult relaxing, healthy sleep routine" \
            --video-language en-US \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --video-clip-duration 3 \
            --video-concat-mode sequential \
            --video-transition-mode fade-in \
            --match-materials-to-script \
            --voice-name en-US-GuyNeural \
            --voice-rate 1.05 \
            --subtitle-enabled \
            --subtitle-position two_thirds_bottom \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --font-size 68 \
            --text-fore-color "#FFE45C" \
            --stroke-color "#000000" \
            --stroke-width 3 \
            --video-count 1 \
            --bgm-type none

      - name: Generate Short 3 - Brain Health
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-script "Want to support your brain health as you get older? Start with everyday habits. Keep learning something new, whether it is a language, an instrument, or a new skill. Stay socially connected with friends and family. Aim for regular physical activity that suits your abilities. And make time for consistent, restful sleep. These habits support overall health, although no single activity can guarantee prevention of memory problems. If you notice persistent changes in memory or thinking, talk to your healthcare professional. Take care of your brain, one day at a time. Follow The Healthy Years." \
            --video-terms "older adult reading book, senior learning new skill, elderly friends talking, senior walking outdoors, healthy brain aging" \
            --video-language en-US \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --video-clip-duration 3 \
            --video-concat-mode sequential \
            --video-transition-mode fade-in \
            --match-materials-to-script \
            --voice-name en-US-GuyNeural \
            --voice-rate 1.05 \
            --subtitle-enabled \
            --subtitle-position two_thirds_bottom \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --font-size 68 \
            --text-fore-color "#FFE45C" \
            --stroke-color "#000000" \
            --stroke-width 3 \
            --video-count 1 \
            --bgm-type none

      - name: Upload all three Shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthy-years-404-three-shorts
          path: MoneyPrinterTurbo/storage/tasks/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
