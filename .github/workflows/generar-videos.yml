
name: Generate YouTube Shorts - FREE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomlkit

      - name: Configure free video generation
        working-directory: MoneyPrinterTurbo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import tomlkit
          from pathlib import Path

          key = os.environ.get("PEXELS_API_KEY")

          if not key:
              raise SystemExit("PEXELS_API_KEY is missing")

          config = tomlkit.parse(
              Path("config.example.toml").read_text()
          )

          config["app"]["video_source"] = "pexels"
          config["app"]["pexels_api_keys"] = [key]

          config["ui"]["video_language"] = "English"
          config["ui"]["voice_name"] = "en-US-GuyNeural"
          config["ui"]["tts_server"] = "azure-tts-v1"
          config["ui"]["voice_mode"] = "tts"
          config["ui"]["subtitle_enabled"] = True

          Path("config.toml").write_text(
              tomlkit.dumps(config)
          )

          print("Pexels configured.")
          print("No paid AI API will be used.")
          print("English male voice selected.")
          PY

      - name: Generate English Short without AI API
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-script "Did you know the universe is almost 14 billion years old? Here are ten incredible facts about space. First, the Sun contains more than 99 percent of our solar system's mass. Second, sunlight takes about eight minutes to reach Earth. Third, a day on Venus is longer than its year. Fourth, neutron stars are incredibly dense. Fifth, there are billions of galaxies in the observable universe. Sixth, Saturn is less dense than water. Seventh, space contains enormous clouds of gas and dust. Eighth, footprints on the Moon can survive for millions of years. Ninth, the universe is expanding. And tenth, looking at distant stars means looking into the past. Which fact surprised you most? Follow for more amazing discoveries!" \
            --video-terms "universe, galaxy, stars, planets, nebula, deep space, astronomy" \
            --video-language en-US \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --voice-name en-US-GuyNeural \
            --subtitle-enabled \
            --subtitle-position bottom \
            --subtitle-display-mode sentence \
            --video-count 1 \
            --bgm-type none

      - name: Upload generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-english-short
          path: MoneyPrinterTurbo/storage/tasks/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
