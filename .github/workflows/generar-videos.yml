
name: Generate YouTube Shorts - Quality V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomlkit

      - name: Configure Pexels and subtitles
        working-directory: MoneyPrinterTurbo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import tomlkit
          from pathlib import Path

          key = os.environ.get("PEXELS_API_KEY")

          if not key:
              raise SystemExit("Missing PEXELS_API_KEY")

          config = tomlkit.parse(
              Path("config.example.toml").read_text()
          )

          app = config["app"]
          app["video_source"] = "pexels"
          app["pexels_api_keys"] = [key]
          app["subtitle_provider"] = "edge"

          ui = config["ui"]
          ui["video_language"] = "English"
          ui["voice_name"] = "en-US-GuyNeural"
          ui["subtitle_enabled"] = True
          ui["subtitle_display_mode"] = "word_by_word"
          ui["subtitle_animation"] = "pop_spring"
          ui["font_size"] = 68
          ui["text_fore_color"] = "#FFE45C"
          ui["stroke_color"] = "#000000"
          ui["stroke_width"] = 3
          ui["subtitle_position"] = "two_thirds_bottom"

          Path("config.toml").write_text(
              tomlkit.dumps(config)
          )

          print("Pexels configured")
          print("Dynamic subtitles configured")
          print("English male voice preserved")
          PY

      - name: Generate improved English Short
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-script "What if I told you the universe is stranger than science fiction? Here are ten incredible facts that will blow your mind. First, the Sun contains more than 99 percent of the mass in our solar system. Second, sunlight takes about eight minutes to reach Earth. Third, a day on Venus lasts longer than its entire year. Fourth, neutron stars are so dense that a tiny amount would weigh billions of tons. Fifth, the observable universe contains billions of galaxies. Sixth, Saturn is less dense than water. Seventh, enormous clouds of gas and dust create the birthplace of stars. Eighth, footprints left on the Moon could survive for millions of years. Ninth, the universe is expanding right now. And tenth, when you look at distant galaxies, you are actually looking into the past. Which fact surprised you most? Follow for more incredible science!" \
            --video-terms "Sun, solar system, Venus planet, neutron star, distant galaxies, Saturn planet, nebula star formation, Moon surface, expanding universe, deep space galaxies" \
            --video-language en-US \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --video-clip-duration 3 \
            --video-concat-mode sequential \
            --video-transition-mode fade-in \
            --match-materials-to-script \
            --voice-name en-US-GuyNeural \
            --voice-rate 1.05 \
            --subtitle-enabled \
            --subtitle-position two_thirds_bottom \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --font-size 68 \
            --text-fore-color "#FFE45C" \
            --stroke-color "#000000" \
            --stroke-width 3 \
            --video-count 1 \
            --bgm-type none

      - name: Upload improved video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: improved-english-short-v2
          path: MoneyPrinterTurbo/storage/tasks/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
