
name: Generar YouTube Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar API
        working-directory: MoneyPrinterTurbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cp config.example.toml config.toml
          python - <<'PY'
          import tomlkit
          from pathlib import Path

          path = Path("config.toml")
          config = tomlkit.parse(path.read_text())

          config["app"]["video_source"] = "pexels"
          config["app"]["pexels_api_keys"] = [
              __import__("os").environ["PEXELS_API_KEY"]
          ]
          config["app"]["litellm_model_name"] = "gemini/gemini-2.5-flash"
          config["app"]["subtitle_provider"] = "edge"

          ui = config["ui"]
          ui["video_language"] = "English"
          ui["video_aspect_pexels"] = "9:16"
          ui["voice_name"] = "en-US-GuyNeural"
          ui["tts_server"] = "azure-tts-v1"
          ui["voice_mode"] = "tts"
          ui["subtitle_enabled"] = True

          path.write_text(tomlkit.dumps(config))
          print("English video configuration prepared.")
          PY

      - name: Comprobar opciones de generación
        working-directory: MoneyPrinterTurbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python cli.py --help

      - name: Guardar información de configuración
        run: |
          echo "English Shorts configuration checked."
          echo "Next topic: 10 Incredible Facts About the Universe"
