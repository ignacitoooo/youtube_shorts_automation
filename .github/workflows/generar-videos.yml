
name: The Healthy Years 404 - Research, Generate and Publish 3 Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: healthy-years-daily-shorts
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout channel repository
        uses: actions/checkout@v4

      - name: Download MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomlkit google-api-python-client google-auth google-auth-httplib2

      - name: Configure Pexels and subtitles
        working-directory: MoneyPrinterTurbo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import tomlkit
          from pathlib import Path

          key = os.environ.get("PEXELS_API_KEY")
          if not key:
              raise SystemExit("Missing PEXELS_API_KEY")

          config = tomlkit.parse(
              Path("config.example.toml").read_text()
          )

          app = config["app"]
          app["video_source"] = "pexels"
          app["pexels_api_keys"] = [key]
          app["subtitle_provider"] = "edge"

          ui = config["ui"]
          ui["video_language"] = "English"
          ui["voice_name"] = "en-US-GuyNeural"
          ui["subtitle_enabled"] = True
          ui["subtitle_display_mode"] = "word_by_word"
          ui["subtitle_animation"] = "pop_spring"
          ui["font_size"] = 68
          ui["text_fore_color"] = "#FFE45C"
          ui["stroke_color"] = "#000000"
          ui["stroke_width"] = 3
          ui["subtitle_position"] = "two_thirds_bottom"

          Path("config.toml").write_text(
              tomlkit.dumps(config)
          )

          print("Configuration completed")
          PY

      - name: Research, generate and upload Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          HISTORY_FILE: data/historial_videos.csv
          VIDEO_WORKDIR: MoneyPrinterTurbo
        run: python scripts/daily_shorts.py

      - name: Save generated videos as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthy-years-404-shorts
          path: |
            MoneyPrinterTurbo/upload_queue/*.mp4
            MoneyPrinterTurbo/storage/tasks/**/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Commit publication history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historial_videos.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube Shorts publication history"
            git push
          else
            echo "No history changes to commit"
          fi
