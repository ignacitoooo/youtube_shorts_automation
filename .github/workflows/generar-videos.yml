
name: Generate YouTube Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomlkit

      - name: Configure OpenAI and Pexels
        working-directory: MoneyPrinterTurbo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import tomlkit
          from pathlib import Path

          openai_key = os.environ["OPENAI_API_KEY"]
          pexels_key = os.environ["PEXELS_API_KEY"]

          if not openai_key or not pexels_key:
              raise SystemExit("Missing API keys")

          config = tomlkit.parse(
              Path("config.example.toml").read_text()
          )

          app = config["app"]

          app["llm_provider"] = "openai"
          app["openai_api_key"] = openai_key
          app["openai_model_name"] = "gpt-4o-mini"

          app["video_source"] = "pexels"
          app["pexels_api_keys"] = [pexels_key]

          app["subtitle_provider"] = "edge"

          Path("config.toml").write_text(
              tomlkit.dumps(config)
          )

          saved = tomlkit.parse(
              Path("config.toml").read_text()
          )

          actual = saved["app"]

          print("Provider:", actual["llm_provider"])
          print("Model:", actual["openai_model_name"])
          print("OpenAI key present:", bool(actual["openai_api_key"]))
          print("Pexels configured:", bool(actual["pexels_api_keys"]))

          assert actual["llm_provider"] == "openai"
          assert actual["openai_api_key"]
          PY

      - name: Generate English Short
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-subject "10 Incredible Facts About the Universe" \
            --video-language en-US \
            --video-script-prompt "Write an engaging 120 to 140 word YouTube Shorts script in natural American English. Include ten fascinating scientifically accurate facts about the universe. Start with a powerful hook and finish with a memorable call to action." \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --voice-name en-US-GuyNeural \
            --subtitle-enabled \
            --subtitle-position bottom \
            --subtitle-display-mode sentence \
            --video-count 1 \
            --bgm-type none

      - name: Upload generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-english-short
          path: MoneyPrinterTurbo/storage/tasks/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
