
name: The Healthy Years 404 - Generate and Publish 3 Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Download MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomlkit google-api-python-client google-auth google-auth-httplib2

      - name: Configure Pexels and subtitles
        working-directory: MoneyPrinterTurbo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import tomlkit
          from pathlib import Path

          key = os.environ.get("PEXELS_API_KEY")
          if not key:
              raise SystemExit("Missing PEXELS_API_KEY")

          config = tomlkit.parse(
              Path("config.example.toml").read_text()
          )

          app = config["app"]
          app["video_source"] = "pexels"
          app["pexels_api_keys"] = [key]
          app["subtitle_provider"] = "edge"

          ui = config["ui"]
          ui["video_language"] = "English"
          ui["voice_name"] = "en-US-GuyNeural"
          ui["subtitle_enabled"] = True
          ui["subtitle_display_mode"] = "word_by_word"
          ui["subtitle_animation"] = "pop_spring"
          ui["font_size"] = 68
          ui["text_fore_color"] = "#FFE45C"
          ui["stroke_color"] = "#000000"
          ui["stroke_width"] = 3
          ui["subtitle_position"] = "two_thirds_bottom"

          Path("config.toml").write_text(
              tomlkit.dumps(config)
          )

          print("Configuration completed")
          PY

      - name: Prepare upload folder
        working-directory: MoneyPrinterTurbo
        run: mkdir -p upload_queue

      - name: Generate Short 1 - Joint Health
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-script "Are your knees feeling stiff after 50? Here are three gentle habits that may support better joint movement. First, avoid sitting in the same position for too long. Stand up and move regularly. Second, try low-impact activities such as walking or swimming, choosing a level that feels comfortable. Third, include strength exercises suited to your ability, because stronger muscles help support your joints. Never push through sharp or worsening pain. If joint pain is persistent, swollen, or affecting daily life, speak with a healthcare professional. Your age does not mean you have to stop moving. Follow The Healthy Years for more practical health tips!" \
            --video-terms "older adult walking in park, senior stretching, swimming pool exercise, senior fitness, healthy active aging" \
            --video-language en-US \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --video-clip-duration 3 \
            --video-concat-mode sequential \
            --video-transition-mode fade-in \
            --match-materials-to-script \
            --voice-name en-US-GuyNeural \
            --voice-rate 1.05 \
            --subtitle-enabled \
            --subtitle-position two_thirds_bottom \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --font-size 68 \
            --text-fore-color "#FFE45C" \
            --stroke-color "#000000" \
            --stroke-width 3 \
            --video-count 1 \
            --bgm-type none

          VIDEO=$(find storage/tasks -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$VIDEO"
          cp "$VIDEO" upload_queue/01-joint-health.mp4

      - name: Generate Short 2 - Better Sleep
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-script "Waking up tired after 50? A few simple sleep habits may help. First, try going to bed and waking up at a consistent time each day. Second, get natural daylight during the morning. Third, keep your bedroom dark, quiet, and comfortably cool. Try limiting caffeine later in the day, too. Remember, persistent sleep problems or loud snoring with breathing pauses deserve medical attention. Better sleep starts with small, consistent habits. Follow The Healthy Years for more healthy aging tips!" \
            --video-terms "senior waking up in bedroom, morning sunlight through window, peaceful bedroom, older adult relaxing, healthy sleep routine" \
            --video-language en-US \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --video-clip-duration 3 \
            --video-concat-mode sequential \
            --video-transition-mode fade-in \
            --match-materials-to-script \
            --voice-name en-US-GuyNeural \
            --voice-rate 1.05 \
            --subtitle-enabled \
            --subtitle-position two_thirds_bottom \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --font-size 68 \
            --text-fore-color "#FFE45C" \
            --stroke-color "#000000" \
            --stroke-width 3 \
            --video-count 1 \
            --bgm-type none

          VIDEO=$(find storage/tasks -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$VIDEO"
          cp "$VIDEO" upload_queue/02-better-sleep.mp4

      - name: Generate Short 3 - Brain Health
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-script "Want to support your brain health as you get older? Start with everyday habits. Keep learning something new, whether it is a language, an instrument, or a new skill. Stay socially connected with friends and family. Aim for regular physical activity that suits your abilities. And make time for consistent, restful sleep. These habits support overall health, although no single activity can guarantee prevention of memory problems. If you notice persistent changes in memory or thinking, talk to your healthcare professional. Take care of your brain, one day at a time. Follow The Healthy Years!" \
            --video-terms "older adult reading book, senior learning new skill, elderly friends talking, senior walking outdoors, healthy brain aging" \
            --video-language en-US \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --video-clip-duration 3 \
            --video-concat-mode sequential \
            --video-transition-mode fade-in \
            --match-materials-to-script \
            --voice-name en-US-GuyNeural \
            --voice-rate 1.05 \
            --subtitle-enabled \
            --subtitle-position two_thirds_bottom \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --font-size 68 \
            --text-fore-color "#FFE45C" \
            --stroke-color "#000000" \
            --stroke-width 3 \
            --video-count 1 \
            --bgm-type none

          VIDEO=$(find storage/tasks -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$VIDEO"
          cp "$VIDEO" upload_queue/03-brain-health.mp4

      - name: Upload Shorts to YouTube as PUBLIC
        working-directory: MoneyPrinterTurbo
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          required = [
              "YT_CLIENT_ID",
              "YT_CLIENT_SECRET",
              "YT_REFRESH_TOKEN",
          ]

          for name in required:
              if not os.environ.get(name):
                  raise SystemExit(f"Missing GitHub secret: {name}")

          scopes = [
              "https://www.googleapis.com/auth/youtube.upload"
          ]

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YT_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YT_CLIENT_ID"],
              client_secret=os.environ["YT_CLIENT_SECRET"],
              scopes=scopes,
          )

          credentials.refresh(Request())

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False,
          )

          videos = [
              {
                  "file": "upload_queue/01-joint-health.mp4",
                  "title": "Stiff Joints After 50? Try These 3 Habits",
                  "description": (
                      "Discover three simple habits that may help support "
                      "joint mobility after 50. Move regularly, stay active "
                      "and listen to your body.\n\n"
                      "This video is for educational purposes and is not "
                      "a substitute for professional medical advice.\n\n"
                      "#JointHealth #HealthyAging #Over50 #Mobility "
                      "#TheHealthyYears #Shorts"
                  ),
                  "tags": [
                      "Joint Health", "Healthy Aging", "Over 50",
                      "Mobility", "The Healthy Years", "Shorts"
                  ],
              },
              {
                  "file": "upload_queue/02-better-sleep.mp4",
                  "title": "Over 50? 3 Simple Habits for Better Sleep",
                  "description": (
                      "Want better sleep after 50? Discover simple daily "
                      "habits that may support a healthier sleep routine.\n\n"
                      "This video is for educational purposes and is not "
                      "a substitute for professional medical advice.\n\n"
                      "#BetterSleep #SleepHealth #Over50 #HealthyHabits "
                      "#TheHealthyYears #Shorts"
                  ),
                  "tags": [
                      "Better Sleep", "Sleep Health", "Over 50",
                      "Healthy Habits", "The Healthy Years", "Shorts"
                  ],
              },
              {
                  "file": "upload_queue/03-brain-health.mp4",
                  "title": "Want a Healthier Brain After 50? Start Here",
                  "description": (
                      "Support your brain health as you age with everyday "
                      "habits that encourage learning, social connection "
                      "and physical activity.\n\n"
                      "This video is for educational purposes and is not "
                      "a substitute for professional medical advice.\n\n"
                      "#BrainHealth #MemoryHealth #HealthyAging #Over50 "
                      "#TheHealthyYears #Shorts"
                  ),
                  "tags": [
                      "Brain Health", "Memory Health", "Healthy Aging",
                      "Over 50", "The Healthy Years", "Shorts"
                  ],
              },
          ]

          for item in videos:
              path = Path(item["file"])

              if not path.is_file():
                  raise SystemExit(f"Video file not found: {path}")

              body = {
                  "snippet": {
                      "title": item["title"],
                      "description": item["description"],
                      "tags": item["tags"],
                      "categoryId": "26",
                      "defaultLanguage": "en",
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False,
                  },
              }

              media = MediaFileUpload(
                  str(path),
                  mimetype="video/mp4",
                  resumable=True,
              )

              request = youtube.videos().insert(
                  part="snippet,status",
                  body=body,
                  media_body=media,
                  notifySubscribers=False,
              )

              response = None

              while response is None:
                  status, response = request.next_chunk()

                  if status:
                      print(
                          f"{item['title']}: "
                          f"{int(status.progress() * 100)}% uploaded"
                      )

              print(
                  f"SUCCESS: {item['title']} "
                  f"https://www.youtube.com/watch?v={response['id']}"
              )

          print("All three videos uploaded as PUBLIC.")

          PY

      - name: Save generated videos as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthy-years-404-three-shorts
          path: |
            MoneyPrinterTurbo/upload_queue/*.mp4
            MoneyPrinterTurbo/storage/tasks/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
