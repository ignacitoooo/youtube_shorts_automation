
name: Generate YouTube Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomlkit

      - name: Configure Gemini and Pexels
        working-directory: MoneyPrinterTurbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import tomlkit
          from pathlib import Path

          gemini = os.environ.get("GEMINI_API_KEY")
          pexels = os.environ.get("PEXELS_API_KEY")

          if not gemini or not pexels:
              raise SystemExit("Missing GitHub API secrets")

          config = tomlkit.parse(
              Path("config.example.toml").read_text(
                  encoding="utf-8"
              )
          )

          app = config["app"]

          app["llm_provider"] = "gemini"
          app["gemini_api_key"] = gemini
          app["gemini_model_name"] = "gemini-2.5-flash"

          app["video_source"] = "pexels"
          app["pexels_api_keys"] = [pexels]
          app["subtitle_provider"] = "edge"

          config["ui"]["video_language"] = "English"
          config["ui"]["voice_name"] = "en-US-GuyNeural"

          Path("config.toml").write_text(
              tomlkit.dumps(config),
              encoding="utf-8"
          )

          assert app["llm_provider"] == "gemini"
          print("LLM provider: gemini")
          print("Gemini API configured")
          print("Pexels API configured")
          print("English voice configured")
          PY

      - name: Generate English Short
        working-directory: MoneyPrinterTurbo
        run: |
          python cli.py \
            --video-subject "10 Incredible Facts About the Universe" \
            --video-language en-US \
            --video-script-prompt "Write approximately 130 words in natural American English. Include ten scientifically accurate and fascinating facts about the universe. Start with a strong hook. Make the script engaging for a 60-second YouTube Short." \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --voice-name en-US-GuyNeural \
            --subtitle-enabled \
            --subtitle-position bottom \
            --video-count 1 \
            --bgm-type none

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-english-short
          path: MoneyPrinterTurbo/storage/tasks/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
