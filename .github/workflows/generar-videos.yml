
name: Generate YouTube Shorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: MoneyPrinterTurbo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tomlkit

      - name: Configure APIs
        working-directory: MoneyPrinterTurbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import tomlkit
          from pathlib import Path

          config = tomlkit.parse(
              Path("config.example.toml").read_text()
          )

          config["pexels_api_keys"] = [
              os.environ["PEXELS_API_KEY"]
          ]
          config["litellm_model_name"] = "gemini/gemini-2.5-flash"
          config["subtitle_provider"] = "edge"

          Path("config.toml").write_text(
              tomlkit.dumps(config)
          )

          print("API configuration ready.")
          PY

      - name: Generate English space video
        working-directory: MoneyPrinterTurbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python cli.py \
            --video-subject "10 Incredible Facts About the Universe" \
            --video-language en-US \
            --video-script-prompt "Create an engaging YouTube Shorts narration of approximately 120 to 140 words, suitable for about 60 seconds. Write in natural American English. Start with a powerful hook, present ten fascinating and scientifically accurate facts about the universe, and finish with a memorable call to action." \
            --video-source pexels \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --voice-name en-US-GuyNeural \
            --subtitle-enabled \
            --subtitle-position bottom \
            --subtitle-display-mode sentence \
            --video-count 1 \
            --bgm-type none

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: first-english-youtube-short
          path: MoneyPrinterTurbo/storage/tasks/**/*.mp4
          if-no-files-found: error
          retention-days: 7
